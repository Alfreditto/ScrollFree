name: Build & Release APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The ubuntu-latest runner ships the Android SDK preinstalled (ANDROID_HOME
      # already set). We only accept licenses here; Android Gradle Plugin will
      # auto-download any missing platform / build-tools it needs at build time.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -path "*/cmdline-tools/*/bin/sdkmanager" 2>/dev/null | head -n 1)
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdkmanager=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            echo "--- installed platforms ---"
            ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # versionCode must strictly increase for the in-app updater to detect updates.
      # We derive it from a monotonically increasing base plus the run number.
      - name: Compute version
        id: version
        run: |
          BASE_CODE=100
          VERSION_CODE=$((BASE_CODE + ${{ github.run_number }}))
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building versionName=1.0.${{ github.run_number }} versionCode=$VERSION_CODE"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Cannot sign release APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Verify keystore credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          K="$RUNNER_TEMP/release.keystore"
          echo "keystore size: $(stat -c%s \"$K\") bytes"
          echo "alias length: ${#KEY_ALIAS}"
          echo "store pass length: ${#KEYSTORE_PASSWORD}"
          echo "key pass length: ${#KEY_PASSWORD}"
          # Check the STORE password and list the alias.
          if ! keytool -list -keystore "$K" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD no coincide con el keystore."
            exit 1
          fi
          echo "::notice::KEYSTORE_PASSWORD OK"
          # Check the KEY password by re-importing the key into a temp keystore, which
          # requires actually decrypting the private key with KEY_PASSWORD.
          if ! keytool -importkeystore \
                -srckeystore "$K" -srcstorepass "$KEYSTORE_PASSWORD" \
                -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASSWORD" \
                -destkeystore "$RUNNER_TEMP/check.keystore" \
                -deststorepass check123 -destkeypass check123 \
                -noprompt > /dev/null 2>&1; then
            echo "::error::KEY_PASSWORD incorrecto para el alias '$KEY_ALIAS' (longitud=${#KEY_PASSWORD}). La clave privada no se puede desencriptar."
            echo "Aliases disponibles en el keystore:"
            keytool -list -keystore "$K" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null || true
            exit 1
          fi
          rm -f "$RUNNER_TEMP/check.keystore"
          echo "::notice::KEY_PASSWORD OK"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }} \
            --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found"
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollFree-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      # Publish a GitHub Release so the in-app updater can find and download it.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: ScrollFree v${{ steps.version.outputs.name }}
          body: |
            Build automática de la rama `${{ github.ref_name }}`.

            - Commit: ${{ github.sha }}
            - versionCode: `${{ steps.version.outputs.code }}`
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
